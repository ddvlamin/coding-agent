[project]
name = "coding-agent"
version = "0.1.0"
description = "devcontainer configuration with different AI vendor assistent configurations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.27.0",
    "omega-memory[server]",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pygithub>=2.10.0",
    "pyyaml>=6.0.3",
    "docker>=7.2.0",
    "jinja2>=3.1.6",
    "cryptography>=50.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ipykernel"
]

[tool.pytest.ini_options]
pythonpath = ["."]
